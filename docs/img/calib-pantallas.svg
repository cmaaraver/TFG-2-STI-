<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 600" width="1500" height="600" font-family="DejaVu Sans, Arial, sans-serif" font-size="15">
<style>
.t{fill:#17201d}.m{fill:#4f5b57;font-size:14px}.h{font-weight:700;font-size:22px;fill:#17201d}
.b{font-weight:700;fill:#17201d}.s{font-size:13px;fill:#17201d}.w{fill:#fff;font-weight:700}
.mono{font-family:DejaVu Sans Mono,monospace;font-size:14px;fill:#d8f5d0}
.monob{font-family:DejaVu Sans Mono,monospace;font-size:14px;fill:#ffffff;font-weight:700}
.pin{font-family:DejaVu Sans Mono,monospace;font-size:13px;fill:#ffe07a;font-weight:700}
.oled{font-family:DejaVu Sans Mono,monospace;font-size:13px;fill:#9fe0ff}
.warn{fill:#b3261e;font-size:14px;font-weight:700}.ok{fill:#1f7a3c;font-size:14px;font-weight:700}
</style>
<defs><marker id="fl" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4f5b57"/></marker></defs>
<rect width="1500" height="600" fill="#f6f8f7"/>
<text x="28" y="38" class="h" text-anchor="start">Qué sale en la pantalla y en el monitor serie</text>
<text x="28" y="62" class="m" text-anchor="start">Izquierda: modo calibración (con el puente). Derecha: funcionamiento normal (sin puente). Los números son de ejemplo.</text>
<rect x="46" y="96" width="278" height="132" rx="10" fill="#20262a" stroke="#20262a" stroke-width="1.5" />
<rect x="60" y="110" width="250" height="104" rx="4" fill="#05121a" stroke="#3b5563" stroke-width="2" />
<text x="185" y="150" class="oled" text-anchor="middle" style="font-weight:700;font-size:16px">MODO CALIBRACION</text>
<text x="185" y="180" class="oled" text-anchor="middle">Monitor serie 115200</text>
<text x="185" y="250" class="m" text-anchor="middle">Pantalla OLED de la LILYGO</text>
<rect x="380" y="96" width="560" height="286" rx="8" fill="#13201b" stroke="#13201b" stroke-width="1.5" />
<rect x="380" y="96" width="560" height="24" rx="8" fill="#2c3a34" stroke="#2c3a34" stroke-width="1.5" />
<text x="392" y="113" class="s" text-anchor="start" style="fill:#c9d6d0">Monitor serie · COM7 · 115200 · modo calibración</text>
<text x="392" y="140" class="monob" text-anchor="start">=== MODO CALIBRACION ===</text>
<text x="392" y="161" class="mono" text-anchor="start">Comandos: leer | mv | ph7 | ph4 | nivel0 | sal |</text>
<text x="392" y="182" class="mono" text-anchor="start">  sal0 | o2_100 | o2_cero | ver | reset | salir</text>
<text x="392" y="203" class="mono" text-anchor="start">Esperando calentamiento de sensores (60 s)...</text>
<text x="392" y="224" class="monob" text-anchor="start">> mv</text>
<text x="392" y="245" class="mono" text-anchor="start">pH: 1512 mV   nivel: 483 mV (4.03 mA, 9 mm ...)</text>
<text x="392" y="266" class="mono" text-anchor="start">   agua: pin=0</text>
<text x="392" y="287" class="monob" text-anchor="start">> leer</text>
<text x="392" y="308" class="mono" text-anchor="start">T=nan C  O2=nan mg/L  pH=6.98  nivel=0 mm</text>
<text x="392" y="329" class="mono" text-anchor="start">   bat=0 mV  agua=0  rs485_err=1</text>
<text x="392" y="350" class="monob" text-anchor="start">> ph7</text>
<text x="392" y="371" class="mono" text-anchor="start">pH7 guardado: 1512.0 mV</text>
<rect x="60" y="300" width="280" height="250" rx="10" fill="#fff" stroke="#9aa8a2" stroke-width="1.5" />
<text x="76" y="328" class="b" text-anchor="start">Cómo leer «leer»</text>
<text x="76" y="360" class="s" text-anchor="start" style="font-size:14px">T y O2 = nan: sin RS485</text>
<text x="76" y="386" class="s" text-anchor="start" style="font-size:14px">   (normal por ahora)</text>
<text x="76" y="412" class="s" text-anchor="start" style="font-size:14px">rs485_err=1: lo mismo</text>
<text x="76" y="438" class="s" text-anchor="start" style="font-size:14px">bat=0 mV: no se mide</text>
<text x="76" y="464" class="s" text-anchor="start" style="font-size:14px">   en este montaje (normal)</text>
<text x="76" y="490" class="s" text-anchor="start" style="font-size:14px">agua=1: hay agua delante</text>
<text x="76" y="516" class="s" text-anchor="start" style="font-size:14px">   del SEN0204</text>
<rect x="986" y="96" width="258" height="132" rx="10" fill="#20262a" stroke="#20262a" stroke-width="1.5" />
<rect x="1000" y="110" width="230" height="104" rx="4" fill="#05121a" stroke="#3b5563" stroke-width="2" />
<text x="1115" y="150" class="oled" text-anchor="middle" style="font-weight:700;font-size:16px">Enviando...</text>
<text x="1115" y="180" class="oled" text-anchor="middle">Siguiente: 14:59</text>
<text x="1115" y="250" class="m" text-anchor="middle">Pantalla OLED de la LILYGO</text>
<rect x="960" y="330" width="510" height="139" rx="8" fill="#13201b" stroke="#13201b" stroke-width="1.5" />
<rect x="960" y="330" width="510" height="24" rx="8" fill="#2c3a34" stroke="#2c3a34" stroke-width="1.5" />
<text x="972" y="347" class="s" text-anchor="start" style="fill:#c9d6d0">Monitor serie · funcionamiento normal</text>
<text x="972" y="374" class="monob" text-anchor="start">--- Nodo calidad agua, ciclo 1 ---</text>
<text x="972" y="395" class="mono" text-anchor="start">Sesion restaurada</text>
<text x="972" y="416" class="mono" text-anchor="start">(o "Join OK (sesion nueva)")</text>
<text x="972" y="437" class="mono" text-anchor="start">... a los 60 s mide y envía ...</text>
<text x="972" y="458" class="monob" text-anchor="start">NUNCA debe salir [SIMULADO]</text>
<text x="1215" y="499" class="warn" text-anchor="middle">Si sale [SIMULADO], está grabado el firmware de prueba:</text>
<text x="1215" y="521" class="m" text-anchor="middle">pio run -e lilygo_t3_simple -t upload --upload-port COM7</text>
</svg>