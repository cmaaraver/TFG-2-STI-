<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 800" width="1500" height="800" font-family="DejaVu Sans, Arial, sans-serif" font-size="15">
<style>
.t{fill:#17201d}.m{fill:#4f5b57;font-size:14px}.h{font-weight:700;font-size:22px;fill:#17201d}
.b{font-weight:700;fill:#17201d}.s{font-size:13px;fill:#17201d}.w{fill:#fff;font-weight:700}
.mono{font-family:DejaVu Sans Mono,monospace;font-size:14px;fill:#d8f5d0}
.monob{font-family:DejaVu Sans Mono,monospace;font-size:14px;fill:#ffffff;font-weight:700}
.pin{font-family:DejaVu Sans Mono,monospace;font-size:13px;fill:#ffe07a;font-weight:700}
.oled{font-family:DejaVu Sans Mono,monospace;font-size:13px;fill:#9fe0ff}
.warn{fill:#b3261e;font-size:14px;font-weight:700}.ok{fill:#1f7a3c;font-size:14px;font-weight:700}
</style>
<defs><marker id="fl" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4f5b57"/></marker></defs>
<rect width="1500" height="800" fill="#f6f8f7"/>
<text x="28" y="38" class="h" text-anchor="start">Nivel: cero con el bidón vacío y tabla de 5 en 5 L</text>
<text x="28" y="62" class="m" text-anchor="start">El KIT0139 va de pie en el fondo. El SEN0204 va pegado por FUERA, a unos 12 cm del fondo. El tubo de aire, sin doblar y con la punta seca.</text>
<path d="M200,170 Q200,130 240,130 L310,130 L310,100 L420,100 L420,130 L490,130 Q530,130 530,170 L530,630 Q530,650 510,650 L220,650 Q200,650 200,630 Z" fill="#f9fbfc" stroke="#6f8390" stroke-width="4"/>
<rect x="204" y="200" width="322" height="446" fill="#8ccbef" opacity=".55"/>
<path d="M536,560 H570" stroke="#1e5fd0" stroke-width="2"/>
<text x="576" y="565" class="s" text-anchor="start" style="fill:#1e5fd0;font-weight:700">5 L</text>
<path d="M204,560 H526" stroke="#1e5fd0" stroke-width="1" stroke-dasharray="6 6" opacity=".6"/>
<path d="M536,470 H570" stroke="#1e5fd0" stroke-width="2"/>
<text x="576" y="475" class="s" text-anchor="start" style="fill:#1e5fd0;font-weight:700">10 L</text>
<path d="M204,470 H526" stroke="#1e5fd0" stroke-width="1" stroke-dasharray="6 6" opacity=".6"/>
<path d="M536,380 H570" stroke="#1e5fd0" stroke-width="2"/>
<text x="576" y="385" class="s" text-anchor="start" style="fill:#1e5fd0;font-weight:700">15 L</text>
<path d="M204,380 H526" stroke="#1e5fd0" stroke-width="1" stroke-dasharray="6 6" opacity=".6"/>
<path d="M536,290 H570" stroke="#1e5fd0" stroke-width="2"/>
<text x="576" y="295" class="s" text-anchor="start" style="fill:#1e5fd0;font-weight:700">20 L</text>
<path d="M204,290 H526" stroke="#1e5fd0" stroke-width="1" stroke-dasharray="6 6" opacity=".6"/>
<path d="M536,200 H570" stroke="#1e5fd0" stroke-width="2"/>
<text x="576" y="205" class="s" text-anchor="start" style="fill:#1e5fd0;font-weight:700">25 L</text>
<path d="M204,200 H526" stroke="#1e5fd0" stroke-width="1" stroke-dasharray="6 6" opacity=".6"/>
<rect x="350" y="560" width="34" height="84" rx="6" fill="#c0c6ca" stroke="#5d666b" stroke-width="2" />
<text x="394" y="600" class="b" text-anchor="start" style="font-size:14px">KIT0139</text>
<path d="M367,560 C367,330 350,120 365,70" stroke="#222" stroke-width="5" fill="none"/>
<text x="390" y="80" class="s" text-anchor="start">cable + tubo de aire (a la caja)</text>
<rect x="164" y="513" width="32" height="44" rx="4" fill="#2f3a8f" stroke="#1b2363" stroke-width="2" />
<text x="180" y="503" class="b" text-anchor="middle" style="font-size:14px">SEN0204</text>
<text x="180" y="575" class="s" text-anchor="middle">(por fuera)</text>
<path d="M140,585 V650" stroke="#b3261e" stroke-width="2" marker-end="url(#fl)"/>
<path d="M130,535 H162" stroke="#b3261e" stroke-width="2"/>
<text x="134" y="625" class="warn" text-anchor="end">≈ 12 cm</text>
<path d="M640,210 L660,190 L690,190 L690,170 L720,170 L720,190 L760,190 L780,210 L780,370 L640,370 Z" fill="#e9f5fd" stroke="#6f8390" stroke-width="3"/>
<text x="710" y="290" class="b" text-anchor="middle" style="font-size:28px;fill:#1e5fd0">5 L</text>
<path d="M630,270 L500,160" stroke="#1e5fd0" stroke-width="3" fill="none" marker-end="url(#fl)" stroke-dasharray="8 6"/>
<text x="710" y="405" class="s" text-anchor="middle" style="font-weight:700">garrafa: de 5 en 5 L</text>
<rect x="800" y="100" width="670" height="250" rx="10" fill="#fff" stroke="#9aa8a2" stroke-width="1.5" />
<text x="818" y="130" class="b" text-anchor="start" style="font-size:18px">A. Cero (bidón VACÍO)</text>
<rect x="818" y="152" width="92" height="22" rx="11" fill="#e07a1f" stroke="#e07a1f" stroke-width="1.5" />
<text x="864" y="168" class="w" text-anchor="middle" style="font-size:12px">PERSONA</text>
<text x="922" y="168" class="s" text-anchor="start" style="font-size:15px">sonda de pie en el fondo, bidón vacío, 1 min</text>
<rect x="818" y="188" width="80" height="22" rx="11" fill="#6d4bd1" stroke="#6d4bd1" stroke-width="1.5" />
<text x="858" y="204" class="w" text-anchor="middle" style="font-size:12px">CLAUDE</text>
<text x="910" y="204" class="mono" text-anchor="start" style="fill:#6d4bd1;font-weight:700">mv (≈ 480 mV estable) → nivel0 → leer</text>
<rect x="818" y="222" width="634" height="76" rx="8" fill="#13201b" stroke="#13201b" stroke-width="1.5" />
<rect x="818" y="222" width="634" height="24" rx="8" fill="#2c3a34" stroke="#2c3a34" stroke-width="1.5" />
<text x="830" y="239" class="s" text-anchor="start" style="fill:#c9d6d0">Monitor</text>
<text x="830" y="266" class="mono" text-anchor="start">Cero del nivel guardado: 9 mm</text>
<text x="830" y="287" class="mono" text-anchor="start">T=nan C  O2=nan mg/L  pH=7.01  nivel=0 mm ...</text>
<rect x="800" y="370" width="670" height="280" rx="10" fill="#fff" stroke="#9aa8a2" stroke-width="1.5" />
<text x="818" y="400" class="b" text-anchor="start" style="font-size:18px">B. De 5 en 5 L (y el SEN0204)</text>
<rect x="818" y="420" width="92" height="22" rx="11" fill="#e07a1f" stroke="#e07a1f" stroke-width="1.5" />
<text x="864" y="436" class="w" text-anchor="middle" style="font-size:12px">PERSONA</text>
<text x="922" y="436" class="s" text-anchor="start" style="font-size:15px">echa una garrafa y dice «listo»</text>
<rect x="818" y="454" width="80" height="22" rx="11" fill="#6d4bd1" stroke="#6d4bd1" stroke-width="1.5" />
<text x="858" y="470" class="w" text-anchor="middle" style="font-size:12px">CLAUDE</text>
<text x="910" y="470" class="s" text-anchor="start" style="font-size:15px">espera 30 s → leer → apunta nivel y agua</text>
<text x="840" y="504" class="b" text-anchor="start" style="font-size:14px">Litros</text>
<text x="960" y="504" class="b" text-anchor="start" style="font-size:14px">nivel= (ejemplo)</text>
<text x="1180" y="504" class="b" text-anchor="start" style="font-size:14px">agua=</text>
<text x="840" y="528" class="s" text-anchor="start" style="font-size:14px">5</text>
<text x="960" y="528" class="s" text-anchor="start" style="font-size:14px">≈ 80 mm</text>
<text x="1180" y="528" class="s" text-anchor="start" style="font-size:14px">0</text>
<text x="840" y="552" class="s" text-anchor="start" style="font-size:14px">10</text>
<text x="960" y="552" class="s" text-anchor="start" style="font-size:14px">≈ 160 mm</text>
<text x="1180" y="552" class="s" text-anchor="start" style="font-size:14px">1 (lo pasa hacia 7-8 L)</text>
<text x="840" y="576" class="s" text-anchor="start" style="font-size:14px">15</text>
<text x="960" y="576" class="s" text-anchor="start" style="font-size:14px">≈ 240 mm</text>
<text x="1180" y="576" class="s" text-anchor="start" style="font-size:14px">1</text>
<text x="840" y="600" class="s" text-anchor="start" style="font-size:14px">20</text>
<text x="960" y="600" class="s" text-anchor="start" style="font-size:14px">≈ 320 mm</text>
<text x="1180" y="600" class="s" text-anchor="start" style="font-size:14px">1</text>
<text x="840" y="624" class="s" text-anchor="start" style="font-size:14px">25</text>
<text x="960" y="624" class="s" text-anchor="start" style="font-size:14px">≈ 400 mm → web</text>
<text x="1180" y="624" class="s" text-anchor="start" style="font-size:14px">1</text>
<text x="28" y="700" class="m" text-anchor="start">El valor con 25 L es el alturaLlenoMm de la web (raspberry/web/static/app.js, ahora 400): así el % y los litros de la tarjeta cuadran con el bidón.</text>
<text x="28" y="724" class="m" text-anchor="start">Los mm de la tabla son orientativos: el sensor tiene un error de unos ±25 mm en este bidón. Si agua no cambia nunca a 1, pulsar SET en la placa del SEN0204.</text>
</svg>