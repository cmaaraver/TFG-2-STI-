<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1040" font-family="IBM Plex Sans, Arial, sans-serif" font-size="15">
<style>
.t{fill:#17201d}.m{fill:#55625d;font-size:13px}.h{font-weight:700;font-size:17px;fill:#17201d}
.box{fill:#fff;stroke:#9aa8a2;stroke-width:1.5}.pwr{fill:#fff4e5;stroke:#e07a10;stroke-width:1.5}
.r12{stroke:#c62828}.r5{stroke:#e07a10}.r33{stroke:#b8930a}.g{stroke:#222}.s{stroke:#1e56c8}.a{stroke:#0f8a96}.b{stroke:#7b3fd1}
.w{fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.pin{font-family:IBM Plex Mono,monospace;font-size:14px;fill:#ffd54a;font-weight:600}
.lab{font-family:IBM Plex Mono,monospace;font-size:13px}
.res{fill:#fff;stroke:#1e56c8;stroke-width:2}
.warn{fill:#a01d1d;font-size:13px;font-weight:600}
</style>
<rect width="1400" height="1040" fill="#f7f9f8"/>
<text x="30" y="40" class="h" font-size="24">Nodo de agua · montaje simple con inversor (12-11-2026)</text>
<text x="30" y="64" class="m">LILYGO T3 V1.6.1 · firmware: entorno lilygo_t3_simple · sin ADS1115, sin aislador, sin conmutadores · la bomba va aparte</text>

<!-- ALIMENTACION -->
<rect x="30" y="85" width="1340" height="150" rx="10" fill="#fffaf2" stroke="#e8c79a"/>
<text x="48" y="110" class="h">Alimentación</text>
<rect x="48" y="125" width="230" height="64" rx="8" class="pwr"/><text x="62" y="150" class="t" font-weight="600">Placas solares + batería</text><text x="62" y="172" class="m">→ inversor → 230 V AC</text>
<rect x="320" y="125" width="170" height="64" rx="8" class="pwr"/><text x="334" y="150" class="t" font-weight="600">Regleta 230 V</text><text x="334" y="172" class="m">solo cosas enchufables</text>
<rect x="540" y="105" width="260" height="56" rx="8" class="pwr"/><text x="554" y="128" class="t" font-weight="600">Cargador USB 5 V (≥ 1 A)</text><text x="554" y="149" class="m">cable USB de datos → LILYGO</text>
<rect x="540" y="170" width="260" height="56" rx="8" class="pwr"/><text x="554" y="193" class="t" font-weight="600">Fuente 12 V DC (≥ 1 A)</text><text x="554" y="214" class="m">rango válido 12-24 V</text>
<path d="M278 157 H320" class="w g"/><path d="M490 157 H515 V133 H540 M515 157 V198 H540" class="w g"/>
<rect x="850" y="105" width="240" height="56" rx="8" class="box"/><text x="864" y="128" class="t" font-weight="600">→ USB de la LILYGO</text><text x="864" y="149" class="m">5V y 3V3 salen de sus pines</text>
<rect x="850" y="170" width="240" height="56" rx="8" class="box"/><text x="864" y="193" class="t" font-weight="600">Bornas +12 V y GND</text><text x="864" y="214" class="m">SEN0681 y KIT0139</text>
<path d="M800 133 H850" class="w r5"/><path d="M800 198 H850" class="w r12"/>
<text x="1110" y="128" class="m">GND de la fuente de 12 V</text><text x="1110" y="146" class="m">unido al GND de la LILYGO</text><text x="1110" y="164" class="m">(una sola masa común).</text>
<text x="1110" y="190" class="warn">Nada de 230 V dentro de la caja:</text><text x="1110" y="208" class="warn">solo fuente y cargador enchufados.</text>

<!-- LILYGO -->
<rect x="520" y="270" width="360" height="610" rx="16" fill="#151d22"/>
<text x="700" y="305" text-anchor="middle" fill="#fff" font-size="22" font-weight="700">LILYGO T3 V1.6.1</text>
<text x="700" y="327" text-anchor="middle" fill="#b9c4c9" font-size="13">ESP32 + SX1276 · 868 MHz · OLED 0x3C</text>
<line x1="700" y1="270" x2="700" y2="245" stroke="#222" stroke-width="4"/><circle cx="700" cy="243" r="6" fill="#222"/>
<text x="712" y="252" class="warn">antena siempre puesta</text>
<!-- pins left -->
<g class="pin">
<text x="538" y="372">5V</text><text x="538" y="412">3V3</text><text x="538" y="452">GND</text>
<text x="538" y="532">GPIO36 pH</text><text x="538" y="612">GPIO39 nivel</text><text x="538" y="702">GPIO4 agua</text><text x="538" y="812">GPIO15 cal</text>
</g>
<g class="pin" text-anchor="end">
<text x="862" y="532">GPIO13 TX</text><text x="862" y="572">GPIO14 RX</text><text x="862" y="612">GPIO25 DE</text><text x="862" y="742">GPIO34 caudal</text>
</g>
<text x="700" y="860" text-anchor="middle" fill="#b9c4c9" font-size="13">GPIO12 libre · sin microSD · sin LiPo en el JST</text>
<g fill="#ffd54a"><rect x="512" y="364" width="12" height="12"/><rect x="512" y="404" width="12" height="12"/><rect x="512" y="444" width="12" height="12"/><rect x="512" y="524" width="12" height="12"/><rect x="512" y="604" width="12" height="12"/><rect x="512" y="694" width="12" height="12"/><rect x="512" y="804" width="12" height="12"/>
<rect x="876" y="524" width="12" height="12"/><rect x="876" y="564" width="12" height="12"/><rect x="876" y="604" width="12" height="12"/><rect x="876" y="734" width="12" height="12"/></g>

<!-- power rails left -->
<path d="M512 370 H470" class="w r5"/><text x="400" y="366" class="lab" fill="#e07a10">+5V →</text>
<path d="M512 410 H470" class="w r33"/><text x="400" y="406" class="lab" fill="#b8930a">3V3 →</text>
<path d="M512 450 H470" class="w g"/><text x="400" y="446" class="lab" fill="#222">GND →</text>
<text x="30" y="470" class="m">El 3V3 es una salida (máx. ~500 mA,</text><text x="30" y="487" class="m">compartida con la radio).</text>

<!-- pH -->
<rect x="30" y="495" width="330" height="80" rx="8" class="box"/>
<text x="44" y="518" class="t" font-weight="600">pH SEN0169-V2 (sonda + placa)</text>
<text x="44" y="540" class="m">placa: + → 3V3 · − → GND</text><text x="44" y="560" class="m">salida 0-3,0 V → GPIO36</text>
<path d="M360 530 H512" class="w a"/>

<!-- nivel -->
<rect x="30" y="585" width="330" height="95" rx="8" class="box"/>
<text x="44" y="608" class="t" font-weight="600">Nivel KIT0139 (4-20 mA, 0-5 m)</text>
<text x="44" y="628" class="m">rojo fino → +12 V · negro → I+ conversor</text><text x="44" y="647" class="m">conversor: I− → GND · VCC → 3V3 · GND</text><text x="44" y="666" class="m">Signal (0,48-2,40 V) → GPIO39</text>
<path d="M360 610 H512" class="w a"/>

<!-- SEN0204 -->
<rect x="30" y="690" width="330" height="80" rx="8" class="box"/>
<text x="44" y="713" class="t" font-weight="600">Presencia de agua SEN0204</text>
<text x="44" y="733" class="m">marrón → 5V · azul → GND · negro sin conectar</text><text x="44" y="753" class="m">amarillo → 10 kΩ → GPIO4 · 20 kΩ a GND</text>
<path d="M360 700 H400" class="w s"/><rect x="400" y="690" width="44" height="20" class="res"/><text x="404" y="682" class="lab" fill="#1e56c8">10k</text>
<path d="M444 700 H512" class="w s"/><circle cx="478" cy="700" r="4" fill="#1e56c8"/><path d="M478 700 V722" class="w s"/><rect x="468" y="722" width="20" height="40" class="res"/><path d="M478 762 V776" class="w g"/><text x="492" y="752" class="lab" fill="#1e56c8">20k</text><text x="460" y="792" class="lab" fill="#222">GND</text>

<!-- modo cal -->
<rect x="30" y="790" width="330" height="70" rx="8" class="box"/>
<text x="44" y="813" class="t" font-weight="600">Puente de calibración</text>
<text x="44" y="833" class="m">jumper de GPIO15 a GND (puesto al arrancar =</text><text x="44" y="851" class="m">calibración). Pull-up interna: sin resistencia.</text>
<path d="M360 810 H512" class="w s"/>

<!-- RS485 -->
<rect x="940" y="495" width="200" height="140" rx="8" class="box" stroke="#7b3fd1"/>
<text x="954" y="518" class="t" font-weight="600">Módulo RS485</text>
<text x="954" y="540" class="lab" fill="#7b3fd1">DI ← GPIO13</text><text x="954" y="560" class="lab" fill="#7b3fd1">RO → GPIO14</text><text x="954" y="580" class="lab" fill="#7b3fd1">DE+RE ← GPIO25</text>
<text x="954" y="602" class="m">VCC → 3V3 · GND</text><text x="954" y="622" class="m">bornas A, B</text>
<path d="M888 530 H940" class="w b"/><path d="M888 570 H940" class="w b"/><path d="M888 610 H940" class="w b"/>
<rect x="1180" y="495" width="190" height="140" rx="8" class="box"/>
<text x="1194" y="518" class="t" font-weight="600">O2 + T SEN0681</text>
<text x="1194" y="540" class="m">marrón → +12 V</text><text x="1194" y="560" class="m">negro → GND</text><text x="1194" y="580" class="m">amarillo → A</text><text x="1194" y="600" class="m">azul → B</text><text x="1194" y="620" class="m">4800 8N1, dir. 1</text>
<path d="M1140 575 H1180" class="w b"/><path d="M1140 595 H1180" class="w b" stroke-dasharray="6 4"/>
<text x="940" y="655" class="m">Con módulo de dirección automática (TXD/RXD):</text><text x="940" y="673" class="m">TXD ← GPIO13, RXD → GPIO14, GPIO25 sin usar.</text>

<!-- caudal -->
<rect x="1000" y="700" width="370" height="95" rx="8" class="box"/>
<text x="1014" y="723" class="t" font-weight="600">Caudalímetro (en la tubería)</text>
<text x="1014" y="743" class="m">rojo → 5V · negro → GND</text><text x="1014" y="763" class="m">amarillo → 10 kΩ → GPIO34 · 20 kΩ a GND</text><text x="1014" y="783" class="m">pulsos de 5 V → 3,3 V</text>
<path d="M888 740 H920" class="w s"/><circle cx="920" cy="740" r="4" fill="#1e56c8"/><path d="M920 740 V760" class="w s"/><rect x="910" y="760" width="20" height="40" class="res"/><path d="M920 800 V812" class="w g"/><text x="936" y="790" class="lab" fill="#1e56c8">20k</text>
<path d="M920 740 H945"  class="w s"/><rect x="945" y="730" width="44" height="20" class="res"/><text x="949" y="722" class="lab" fill="#1e56c8">10k</text><path d="M989 740 H1000" class="w s"/>

<!-- bomba -->
<rect x="940" y="830" width="430" height="50" rx="8" fill="#f1f3f2" stroke="#c5ceca"/>
<text x="954" y="852" class="t" font-weight="600">Bomba: aparte, con su propia alimentación</text><text x="954" y="871" class="m">no se conecta al nodo; el nodo solo mide su caudal</text>

<!-- notas -->
<rect x="30" y="900" width="1340" height="120" rx="10" fill="#fff" stroke="#d6ddda"/>
<text x="48" y="925" class="h">Antes de enchufar</text>
<text x="48" y="950" class="m">1. Fuente de 12 V sola: 12-13 V en las bornas.   2. Con todo conectado y la LILYGO fuera: ningún cable de GPIO por encima de 3,3 V.</text>
<text x="48" y="972" class="m">3. Sin tarjeta microSD ni batería LiPo en la LILYGO.   4. GPIO12 sin conectar (pin de arranque).   5. Sonda de pH siempre mojada.</text>
<text x="48" y="994" class="m">Sin aislador, el pH comparte masa con el SEN0681, el KIT0139 y la bomba, que están en la misma agua: si el pH baila, mirar si cambia al desenchufar la bomba.</text>
<text x="48" y="1012" class="m">Leyenda: rojo +12 V · naranja +5 V · amarillo 3V3 · negro GND · azul señal digital · turquesa analógica · morado RS485/UART</text>
</svg>
