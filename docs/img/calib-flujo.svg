<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 430" width="1500" height="430" font-family="DejaVu Sans, Arial, sans-serif" font-size="15">
<style>
.t{fill:#17201d}.m{fill:#4f5b57;font-size:14px}.h{font-weight:700;font-size:22px;fill:#17201d}
.b{font-weight:700;fill:#17201d}.s{font-size:13px;fill:#17201d}.w{fill:#fff;font-weight:700}
.mono{font-family:DejaVu Sans Mono,monospace;font-size:14px;fill:#d8f5d0}
.monob{font-family:DejaVu Sans Mono,monospace;font-size:14px;fill:#ffffff;font-weight:700}
.pin{font-family:DejaVu Sans Mono,monospace;font-size:13px;fill:#ffe07a;font-weight:700}
.oled{font-family:DejaVu Sans Mono,monospace;font-size:13px;fill:#9fe0ff}
.warn{fill:#b3261e;font-size:14px;font-weight:700}.ok{fill:#1f7a3c;font-size:14px;font-weight:700}
</style>
<defs><marker id="fl" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4f5b57"/></marker></defs>
<rect width="1500" height="430" fill="#f6f8f7"/>
<text x="28" y="38" class="h" text-anchor="start">Calibración en 7 pasos · unos 45 min (65 min con el oxígeno)</text>
<text x="28" y="62" class="m" text-anchor="start">Naranja = lo hace la persona (Carlos o Rubén). Morado = lo hace Claude con calibrar.py. Cada paso termina con una comprobación.</text>
<rect x="28" y="100" width="196" height="250" rx="12" fill="#fff" stroke="#2f7d6d" stroke-width="2.5" />
<rect x="28" y="100" width="196" height="54" rx="12" fill="#2f7d6d" stroke="#2f7d6d" stroke-width="1.5" />
<rect x="28" y="138" width="196" height="16" fill="#2f7d6d"/>
<circle cx="58" cy="127" r="17" fill="#fff"/>
<text x="58" y="133" class="b" text-anchor="middle" style="fill:#2f7d6d;font-size:18px">1</text>
<text x="84" y="133" class="w" text-anchor="start" style="font-size:17px">Preparación</text>
<text x="126" y="190" class="b" text-anchor="middle" style="font-size:20px">10 min</text>
<text x="126" y="228" class="s" text-anchor="middle" style="font-size:14px">Grabar firmware real.</text>
<text x="126" y="250" class="s" text-anchor="middle" style="font-size:14px">Puente IO15–GND.</text>
<rect x="38" y="299" width="92" height="22" rx="11" fill="#e07a1f" stroke="#e07a1f" stroke-width="1.5" />
<text x="84" y="315" class="w" text-anchor="middle" style="font-size:12px">PERSONA</text>
<rect x="136" y="299" width="80" height="22" rx="11" fill="#6d4bd1" stroke="#6d4bd1" stroke-width="1.5" />
<text x="176" y="315" class="w" text-anchor="middle" style="font-size:12px">CLAUDE</text>
<path d="M226,225 L234,225" stroke="#4f5b57" stroke-width="2.5" fill="none" marker-end="url(#fl)"/>
<rect x="236" y="100" width="196" height="250" rx="12" fill="#fff" stroke="#2f7d6d" stroke-width="2.5" />
<rect x="236" y="100" width="196" height="54" rx="12" fill="#2f7d6d" stroke="#2f7d6d" stroke-width="1.5" />
<rect x="236" y="138" width="196" height="16" fill="#2f7d6d"/>
<circle cx="266" cy="127" r="17" fill="#fff"/>
<text x="266" y="133" class="b" text-anchor="middle" style="fill:#2f7d6d;font-size:18px">2</text>
<text x="292" y="133" class="w" text-anchor="start" style="font-size:17px">Comprobar</text>
<text x="334" y="190" class="b" text-anchor="middle" style="font-size:20px">5 min</text>
<text x="334" y="228" class="s" text-anchor="middle" style="font-size:14px">mv y leer:</text>
<text x="334" y="250" class="s" text-anchor="middle" style="font-size:14px">¿cableado bien?</text>
<rect x="246" y="299" width="92" height="22" rx="11" fill="#e07a1f" stroke="#e07a1f" stroke-width="1.5" />
<text x="292" y="315" class="w" text-anchor="middle" style="font-size:12px">PERSONA</text>
<rect x="344" y="299" width="80" height="22" rx="11" fill="#6d4bd1" stroke="#6d4bd1" stroke-width="1.5" />
<text x="384" y="315" class="w" text-anchor="middle" style="font-size:12px">CLAUDE</text>
<path d="M434,225 L442,225" stroke="#4f5b57" stroke-width="2.5" fill="none" marker-end="url(#fl)"/>
<rect x="444" y="100" width="196" height="250" rx="12" fill="#fff" stroke="#8e3fd1" stroke-width="2.5" />
<rect x="444" y="100" width="196" height="54" rx="12" fill="#8e3fd1" stroke="#8e3fd1" stroke-width="1.5" />
<rect x="444" y="138" width="196" height="16" fill="#8e3fd1"/>
<circle cx="474" cy="127" r="17" fill="#fff"/>
<text x="474" y="133" class="b" text-anchor="middle" style="fill:#8e3fd1;font-size:18px">3</text>
<text x="500" y="133" class="w" text-anchor="start" style="font-size:17px">pH</text>
<text x="542" y="190" class="b" text-anchor="middle" style="font-size:20px">20 min</text>
<text x="542" y="228" class="s" text-anchor="middle" style="font-size:14px">Tampón 7 → ph7</text>
<text x="542" y="250" class="s" text-anchor="middle" style="font-size:14px">Tampón 4 → ph4</text>
<rect x="454" y="299" width="92" height="22" rx="11" fill="#e07a1f" stroke="#e07a1f" stroke-width="1.5" />
<text x="500" y="315" class="w" text-anchor="middle" style="font-size:12px">PERSONA</text>
<rect x="552" y="299" width="80" height="22" rx="11" fill="#6d4bd1" stroke="#6d4bd1" stroke-width="1.5" />
<text x="592" y="315" class="w" text-anchor="middle" style="font-size:12px">CLAUDE</text>
<path d="M642,225 L650,225" stroke="#4f5b57" stroke-width="2.5" fill="none" marker-end="url(#fl)"/>
<rect x="652" y="100" width="196" height="250" rx="12" fill="#fff" stroke="#1e5fd0" stroke-width="2.5" />
<rect x="652" y="100" width="196" height="54" rx="12" fill="#1e5fd0" stroke="#1e5fd0" stroke-width="1.5" />
<rect x="652" y="138" width="196" height="16" fill="#1e5fd0"/>
<circle cx="682" cy="127" r="17" fill="#fff"/>
<text x="682" y="133" class="b" text-anchor="middle" style="fill:#1e5fd0;font-size:18px">4</text>
<text x="708" y="133" class="w" text-anchor="start" style="font-size:17px">Cero nivel</text>
<text x="750" y="190" class="b" text-anchor="middle" style="font-size:20px">5 min</text>
<text x="750" y="228" class="s" text-anchor="middle" style="font-size:14px">Bidón vacío</text>
<text x="750" y="250" class="s" text-anchor="middle" style="font-size:14px">→ nivel0</text>
<rect x="662" y="299" width="92" height="22" rx="11" fill="#e07a1f" stroke="#e07a1f" stroke-width="1.5" />
<text x="708" y="315" class="w" text-anchor="middle" style="font-size:12px">PERSONA</text>
<rect x="760" y="299" width="80" height="22" rx="11" fill="#6d4bd1" stroke="#6d4bd1" stroke-width="1.5" />
<text x="800" y="315" class="w" text-anchor="middle" style="font-size:12px">CLAUDE</text>
<path d="M850,225 L858,225" stroke="#4f5b57" stroke-width="2.5" fill="none" marker-end="url(#fl)"/>
<rect x="860" y="100" width="196" height="250" rx="12" fill="#fff" stroke="#1e5fd0" stroke-width="2.5" />
<rect x="860" y="100" width="196" height="54" rx="12" fill="#1e5fd0" stroke="#1e5fd0" stroke-width="1.5" />
<rect x="860" y="138" width="196" height="16" fill="#1e5fd0"/>
<circle cx="890" cy="127" r="17" fill="#fff"/>
<text x="890" y="133" class="b" text-anchor="middle" style="fill:#1e5fd0;font-size:18px">5</text>
<text x="916" y="133" class="w" text-anchor="start" style="font-size:17px">5 en 5 L</text>
<text x="958" y="190" class="b" text-anchor="middle" style="font-size:20px">15 min</text>
<text x="958" y="228" class="s" text-anchor="middle" style="font-size:14px">Nivel cada 5 L.</text>
<text x="958" y="250" class="s" text-anchor="middle" style="font-size:14px">SEN0204 cambia a 1</text>
<rect x="870" y="299" width="92" height="22" rx="11" fill="#e07a1f" stroke="#e07a1f" stroke-width="1.5" />
<text x="916" y="315" class="w" text-anchor="middle" style="font-size:12px">PERSONA</text>
<rect x="968" y="299" width="80" height="22" rx="11" fill="#6d4bd1" stroke="#6d4bd1" stroke-width="1.5" />
<text x="1008" y="315" class="w" text-anchor="middle" style="font-size:12px">CLAUDE</text>
<path d="M1058,225 L1066,225" stroke="#4f5b57" stroke-width="2.5" fill="none" marker-end="url(#fl)"/>
<rect x="1068" y="100" width="196" height="250" rx="12" fill="#fff" stroke="#0e8fb5" stroke-width="2.5" stroke-dasharray="8 5"/>
<rect x="1068" y="100" width="196" height="54" rx="12" fill="#0e8fb5" stroke="#0e8fb5" stroke-width="1.5" />
<rect x="1068" y="138" width="196" height="16" fill="#0e8fb5"/>
<circle cx="1098" cy="127" r="17" fill="#fff"/>
<text x="1098" y="133" class="b" text-anchor="middle" style="fill:#0e8fb5;font-size:18px">6</text>
<text x="1124" y="133" class="w" text-anchor="start" style="font-size:17px">Oxígeno</text>
<text x="1166" y="190" class="b" text-anchor="middle" style="font-size:20px">20 min</text>
<text x="1166" y="228" class="s" text-anchor="middle" style="font-size:14px">Solo con RS485:</text>
<text x="1166" y="250" class="s" text-anchor="middle" style="font-size:14px">sal0 y o2_100</text>
<rect x="1078" y="299" width="92" height="22" rx="11" fill="#e07a1f" stroke="#e07a1f" stroke-width="1.5" />
<text x="1124" y="315" class="w" text-anchor="middle" style="font-size:12px">PERSONA</text>
<rect x="1176" y="299" width="80" height="22" rx="11" fill="#6d4bd1" stroke="#6d4bd1" stroke-width="1.5" />
<text x="1216" y="315" class="w" text-anchor="middle" style="font-size:12px">CLAUDE</text>
<text x="1166" y="372" class="warn" text-anchor="middle" style="font-size:12px">opcional hasta tener el RS485</text>
<path d="M1266,225 L1274,225" stroke="#4f5b57" stroke-width="2.5" fill="none" marker-end="url(#fl)"/>
<rect x="1276" y="100" width="196" height="250" rx="12" fill="#fff" stroke="#2f7d6d" stroke-width="2.5" />
<rect x="1276" y="100" width="196" height="54" rx="12" fill="#2f7d6d" stroke="#2f7d6d" stroke-width="1.5" />
<rect x="1276" y="138" width="196" height="16" fill="#2f7d6d"/>
<circle cx="1306" cy="127" r="17" fill="#fff"/>
<text x="1306" y="133" class="b" text-anchor="middle" style="fill:#2f7d6d;font-size:18px">7</text>
<text x="1332" y="133" class="w" text-anchor="start" style="font-size:17px">Cerrar</text>
<text x="1374" y="190" class="b" text-anchor="middle" style="font-size:20px">5 min</text>
<text x="1374" y="228" class="s" text-anchor="middle" style="font-size:14px">Quitar puente.</text>
<text x="1374" y="250" class="s" text-anchor="middle" style="font-size:14px">Comprobar la web</text>
<rect x="1286" y="299" width="92" height="22" rx="11" fill="#e07a1f" stroke="#e07a1f" stroke-width="1.5" />
<text x="1332" y="315" class="w" text-anchor="middle" style="font-size:12px">PERSONA</text>
<rect x="1384" y="299" width="80" height="22" rx="11" fill="#6d4bd1" stroke="#6d4bd1" stroke-width="1.5" />
<text x="1424" y="315" class="w" text-anchor="middle" style="font-size:12px">CLAUDE</text>
<text x="28" y="410" class="m" text-anchor="start">El orden importa: el pH va antes que el nivel, porque el comando reset (por si el pH sale mal) también borra el cero del nivel.</text>
</svg>