<text x="28" y="38" class="h" text-anchor="start">Puente de calibración: un dupont hembra-hembra entre IO15 y GND</text>
<text x="28" y="62" class="m" text-anchor="start">Con el puente puesto al arrancar, la LILYGO entra en el menú de calibración. Sin el puente, funciona normal y envía cada 15 min.</text>
