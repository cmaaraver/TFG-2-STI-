<text x="46" y="140" class="b" text-anchor="start">Cómo ponerlo</text>
<text x="46" y="172" class="s" text-anchor="start" style="font-size:15px">1. Fuente de 12 V apagada.</text>
<text x="46" y="202" class="s" text-anchor="start" style="font-size:15px">2. Hembra del dupont en IO15 (tira</text>
<text x="46" y="232" class="s" text-anchor="start" style="font-size:15px">    izquierda, 9.º pin desde arriba).</text>
<text x="46" y="262" class="s" text-anchor="start" style="font-size:15px">3. La otra hembra en GND (tira</text>
<text x="46" y="292" class="s" text-anchor="start" style="font-size:15px">    derecha, 10.º pin desde arriba).</text>
<text x="46" y="322" class="s" text-anchor="start" style="font-size:15px">4. Encender la fuente y pulsar RST.</text>
<text x="46" y="352" class="s" text-anchor="start" style="font-size:15px">5. La OLED pone MODO CALIBRACION.</text>
<rect x="28" y="430" width="380" height="170" rx="10" fill="#fff3f2" stroke="#e0a19b" stroke-width="1.5" />
<text x="46" y="460" class="warn" text-anchor="start">Errores típicos</text>
<text x="46" y="492" class="s" text-anchor="start" style="font-size:15px">✗ En IO12 o IO2: la placa no arranca.</text>
<text x="46" y="520" class="s" text-anchor="start" style="font-size:15px">✗ En IO13 (justo encima): es el RS485.</text>
<text x="46" y="548" class="s" text-anchor="start" style="font-size:15px">✗ Olvidarlo puesto al acabar: el nodo</text>
<text x="46" y="576" class="s" text-anchor="start" style="font-size:15px">    se queda en el menú y no envía.</text>
<rect x="1092" y="110" width="380" height="250" rx="10" fill="#fff" stroke="#9aa8a2" stroke-width="1.5" />
<text x="1110" y="140" class="b" text-anchor="start">Colores de los otros pines</text>
