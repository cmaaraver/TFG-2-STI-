<text x="1138" y="312" class="s" text-anchor="start" style="font-size:15px">IO25: RS485 DE</text>
<rect x="1110" y="326" width="18" height="18" rx="3" fill="#f07c00"/>
<text x="1138" y="340" class="s" text-anchor="start" style="font-size:15px">3.3V: 3V3</text>
<rect x="1092" y="380" width="380" height="120" rx="10" fill="#f1fbf4" stroke="#9cc9a8" stroke-width="1.5" />
<text x="1110" y="410" class="ok" text-anchor="start">Cómo saber que ha entrado</text>
<text x="1110" y="440" class="s" text-anchor="start" style="font-size:15px">OLED: «MODO CALIBRACION».</text>
<text x="1110" y="468" class="s" text-anchor="start" style="font-size:15px">Monitor: «=== MODO CALIBRACION ===».</text>
