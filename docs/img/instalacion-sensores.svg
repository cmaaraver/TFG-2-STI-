<text x="40" y="520" font-size="12" font-weight="700" fill="#b45309" text-anchor="start">Bidón a la SOMBRA: 25 L se</text>
<text x="40" y="537" font-size="12" font-weight="700" fill="#b45309" text-anchor="start">calientan rápido (SEN0681</text>
<text x="40" y="554" font-size="12" font-weight="700" fill="#b45309" text-anchor="start">hasta 40 °C).</text>
