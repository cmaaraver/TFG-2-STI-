<circle cx="1165" cy="375" r="12" fill="#b91c1c"/>
<text x="1165" y="380" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">F</text>
<text x="1165" y="550" font-size="11.5" font-weight="700" fill="#b45309" text-anchor="middle">4 respiraderos pequeños (hechos)</text>
<circle cx="1300" cy="410" r="11" fill="#fff" stroke="#111" stroke-width="2" stroke-dasharray="3,2"/>
<circle cx="1330" cy="410" r="12" fill="#b91c1c"/>
<text x="1330" y="415" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">D</text>
<circle cx="1300" cy="490" r="11" fill="#fff" stroke="#111" stroke-width="2" stroke-dasharray="3,2"/>
<circle cx="1330" cy="490" r="12" fill="#b91c1c"/>
<text x="1330" y="495" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">E</text>
<text x="1300" y="545" font-size="11.5" font-weight="700" fill="#b45309" text-anchor="middle">por hacer</text>
<text x="960" y="626" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start">Izquierda = lado del tapón; el SEN0204 va en esa pared, por fuera.</text>
<text x="40" y="870" font-size="14" font-weight="700" fill="#0f172a" text-anchor="start">Agujeros (medir antes cables y sondas)</text>
<circle cx="60" cy="898" r="12" fill="#b91c1c"/>
<text x="60" y="903" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">A</text>
<text x="82" y="902" font-size="13" font-weight="400" fill="#334155" text-anchor="start">Tapón: cable del pH, ~15 mm (pasa el BNC)</text>
<circle cx="60" cy="924" r="12" fill="#b91c1c"/>
<text x="60" y="929" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">B</text>
<text x="82" y="928" font-size="13" font-weight="400" fill="#334155" text-anchor="start">Tapón: cable del SEN0681, a su diámetro (~6-8 mm)</text>
<circle cx="60" cy="950" r="12" fill="#b91c1c"/>
<text x="60" y="955" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">C</text>
<text x="82" y="954" font-size="13" font-weight="400" fill="#334155" text-anchor="start">Tapón: cable del KIT0139 (~7-8 mm), sin apretar el tubo de aire</text>
<circle cx="60" cy="976" r="12" fill="#b91c1c"/>
<text x="60" y="981" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">D</text>
<text x="82" y="980" font-size="13" font-weight="400" fill="#334155" text-anchor="start">Por hacer, punta contraria: aspiración de la bomba (grosor de la manguera)</text>
<circle cx="680" cy="898" r="12" fill="#b91c1c"/>
<text x="680" y="903" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">E</text>
<text x="702" y="902" font-size="13" font-weight="400" fill="#334155" text-anchor="start">Por hacer, junto al D: retorno de la bomba (grosor de la manguera)</text>
<circle cx="680" cy="924" r="12" fill="#b91c1c"/>
<text x="680" y="929" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">F</text>
<text x="702" y="928" font-size="13" font-weight="400" fill="#334155" text-anchor="start">Hechos 4 junto al asa: 4 respiraderos pequeños (los pide el KIT0139)</text>
<circle cx="680" cy="950" r="12" fill="#64748b"/>
<text x="680" y="955" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">G</text>
<text x="702" y="954" font-size="13" font-weight="400" fill="#334155" text-anchor="start">Solo si el SEN0681 no pasa por la boca: a su medida</text>
<text x="40" y="1020" font-size="12" font-weight="700" fill="#0f172a" text-anchor="start">Las sondas entran de una en una por la boca. A, B y C con</text>
<text x="40" y="1037" font-size="12" font-weight="700" fill="#0f172a" text-anchor="start">silicona neutra por fuera. Ningún agujero bajo el agua.</text>
<text x="30" y="1110" font-size="13" font-weight="400" fill="#475569" text-anchor="start">Nivel: el KIT0139 mide 0-5 m con ±0,5 % (±25 mm); en el bidón son unos ±1,5 L (±6 %). La web lo enseña en % del bidón (docs/06, apartado 1.4).</text>
