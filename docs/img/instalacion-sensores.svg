<text x="30" y="40" font-size="24" font-weight="700" fill="#0f172a" text-anchor="start">Bidón de 25 L de la maqueta: sondas y agujeros (sin caudalímetro, bomba fuera)</text>
<text x="30" y="64" font-size="14" font-weight="400" fill="#475569" text-anchor="start">Medidas típicas de un bidón de 25 L (≈ 40 cm de alto, 29 × 24 cm de planta): medir el real. Todos los agujeros van arriba, por encima del agua.</text>
