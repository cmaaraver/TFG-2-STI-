<text x="476" y="404" font-size="13" font-weight="700" fill="#0f172a" text-anchor="start">Oxígeno SEN0681</text>
<text x="476" y="420" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start">membrana abajo, a 8-10 cm del fondo</text>
<text x="476" y="474" font-size="13" font-weight="700" fill="#0f172a" text-anchor="start">pH SEN0169-V2 (Ø 27 mm)</text>
<text x="476" y="490" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start">punta a 8-10 cm del fondo, siempre mojada</text>
<text x="476" y="734" font-size="13" font-weight="700" fill="#0f172a" text-anchor="start">KIT0139 (nivel) en el fondo</text>
<text x="975" y="834" font-size="13" font-weight="700" fill="#0f172a" text-anchor="start">Bomba FUERA del bidón (aparte)</text>
<text x="975" y="850" font-size="11.5" font-weight="700" fill="#b45309" text-anchor="start">autocebante o cebarla la 1.ª vez; sin cable al nodo</text>
<text x="40" y="600" font-size="13" font-weight="700" fill="#0f172a" text-anchor="start">SEN0204 pegado por FUERA</text>
<text x="40" y="616" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start">pared del lado del tapón,</text>
<text x="40" y="632" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start">a ~12 cm del fondo (sin agujero)</text>
<text x="975" y="682" font-size="11.5" font-weight="400" fill="#0369a1" text-anchor="start">D: aspira a ~3 cm del fondo, con rejilla.</text>
<text x="975" y="698" font-size="11.5" font-weight="400" fill="#0369a1" text-anchor="start">E: devuelve 5 cm bajo el nivel mínimo,</text>
<text x="975" y="714" font-size="11.5" font-weight="400" fill="#0369a1" text-anchor="start">apuntando a la pared (sin burbujas en las sondas)</text>
<rect x="40" y="330" width="210" height="150" rx="10" fill="#e2e8f0" stroke="#111" stroke-width="3" />
<text x="145" y="360" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle">Caja del nodo</text>
<text x="145" y="384" font-size="12" font-weight="400" fill="#334155" text-anchor="middle">LILYGO T3 V1.6.1, placa</text>
<text x="145" y="401" font-size="12" font-weight="400" fill="#334155" text-anchor="middle">del pH, conversor 4-20 mA,</text>
<text x="145" y="418" font-size="12" font-weight="400" fill="#334155" text-anchor="middle">RS485 y resistencias</text>
<text x="145" y="446" font-size="11.5" font-weight="700" fill="#b91c1c" text-anchor="middle">cables hacia ABAJO (goteo)</text>
<line x1="145" y1="330" x2="145" y2="290" stroke="#111" stroke-width="4" />
<path d="M135,290 L145,265 L155,290 z" fill="#111"/>
<text x="130" y="284" font-size="12" font-weight="700" fill="#0f172a" text-anchor="end">antena 868 MHz</text>
<text x="40" y="520" font-size="12" font-weight="700" fill="#b45309" text-anchor="start">Bidón a la SOMBRA: 25 L se</text>
<text x="40" y="537" font-size="12" font-weight="700" fill="#b45309" text-anchor="start">calientan rápido (SEN0681</text>
<text x="40" y="554" font-size="12" font-weight="700" fill="#b45309" text-anchor="start">hasta 40 °C).</text>
<text x="960" y="264" font-size="15" font-weight="700" fill="#0f172a" text-anchor="start">VISTA DE ARRIBA</text>
