<text x="476" y="404" font-size="13" font-weight="700" fill="#0f172a" text-anchor="start">Oxígeno SEN0681</text>
<text x="476" y="420" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start">membrana abajo, a 8-10 cm del fondo</text>
<text x="476" y="474" font-size="13" font-weight="700" fill="#0f172a" text-anchor="start">pH SEN0169-V2 (Ø 27 mm)</text>
<text x="476" y="490" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start">punta a 8-10 cm del fondo, siempre mojada</text>
<text x="476" y="734" font-size="13" font-weight="700" fill="#0f172a" text-anchor="start">KIT0139 (nivel) en el fondo</text>
<text x="876" y="762" font-size="13" font-weight="700" fill="#0f172a" text-anchor="start">Bomba + rejilla (aparte)</text>
<text x="876" y="778" font-size="11.5" font-weight="700" fill="#b45309" text-anchor="start">alimentación propia, sin cable al nodo</text>
<text x="876" y="628" font-size="13" font-weight="700" fill="#0f172a" text-anchor="start">SEN0204 pegado por FUERA</text>
<text x="876" y="644" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start">en una cara lisa, a 12 cm del fondo</text>
<text x="876" y="660" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start">(sin agujero; pared de 2-3 mm)</text>
<text x="876" y="708" font-size="11.5" font-weight="400" fill="#0369a1" text-anchor="start">E: retorno 5 cm bajo el nivel mínimo,</text>
<text x="876" y="724" font-size="11.5" font-weight="400" fill="#0369a1" text-anchor="start">apuntando a la pared (sin burbujas en las sondas)</text>
<rect x="40" y="330" width="210" height="150" rx="10" fill="#e2e8f0" stroke="#111" stroke-width="3" />
<text x="145" y="360" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle">Caja del nodo</text>
<text x="145" y="384" font-size="12" font-weight="400" fill="#334155" text-anchor="middle">LILYGO T3 V1.6.1, placa</text>
<text x="145" y="401" font-size="12" font-weight="400" fill="#334155" text-anchor="middle">del pH, conversor 4-20 mA,</text>
<text x="145" y="418" font-size="12" font-weight="400" fill="#334155" text-anchor="middle">RS485 y resistencias</text>
<text x="145" y="446" font-size="11.5" font-weight="700" fill="#b91c1c" text-anchor="middle">cables hacia ABAJO (goteo)</text>
