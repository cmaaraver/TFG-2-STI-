# Mosquitto de la Raspberry. Solo escucha dentro de la red Docker
# (ChirpStack, Gateway Bridge e ingestor): el puerto NO se publica fuera.
listener 1883
allow_anonymous true

# Cola persistente: si el ingestor está parado, los mensajes QoS 1 esperan aquí
persistence true
persistence_location /mosquitto/data/
autosave_interval 60
max_queued_messages 100000
max_inflight_messages 20
