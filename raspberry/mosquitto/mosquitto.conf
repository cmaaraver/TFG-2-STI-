# Mosquitto de la Raspberry (sustituye al de chirpstack-docker)
per_listener_settings true

# Listener interno: solo red Docker (ChirpStack y Gateway Bridge). No publicar este puerto.
listener 1883
allow_anonymous true

# Listener LAN para el ingestor del PC (publicar en docker-compose como "192.168.50.1:1884:1884")
listener 1884
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl

# Cola persistente: si el PC está apagado, los mensajes QoS 1 esperan aquí
persistence true
persistence_location /mosquitto/data/
autosave_interval 60
max_queued_messages 100000
max_inflight_messages 20
