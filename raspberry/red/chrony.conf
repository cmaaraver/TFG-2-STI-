# /etc/chrony/chrony.conf — Raspberry Pi 5
# Fuentes de hora cuando hay Internet (si la red del centro bloquea NTP, pedir su servidor al coordinador TIC)
pool es.pool.ntp.org iburst
# Si no hay Internet se sigue sirviendo la hora del RTC local
local stratum 10
# Servir hora a la red privada (wAP LR8)
allow 192.168.50.0/24
# Guardar deriva y ajustar el RTC
driftfile /var/lib/chrony/chrony.drift
rtcsync
makestep 1.0 3
