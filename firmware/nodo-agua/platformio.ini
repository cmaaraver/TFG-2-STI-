; Proyecto PlatformIO del nodo de calidad del agua
; Elegir el entorno según la placa (y la misma placa en include/config.h)
;   Compilar:          pio run -e lilygo_t3_v1_6_1
;   Grabar:            pio run -e lilygo_t3_v1_6_1 -t upload
;   Monitor serie:     pio device monitor

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
; Versiones fijas: la API LoRaWAN de RadioLib cambia entre versiones
lib_deps =
    jgromes/RadioLib@7.8.1
    adafruit/Adafruit ADS1X15@2.6.2
    4-20ma/ModbusMaster@2.0.1
    olikraus/U8g2@2.36.18
build_flags = -Wall

[env:lilygo_t3_v1_6_1]
board = ttgo-lora32-v21
build_flags = ${env.build_flags} -DPLACA_LILYGO_T3_V1_6_1 -DLORAWAN_DR_JOIN=0

; Banco de pruebas con la LILYGO suelta (sin placa base): GPIO36 no tiene pull-up y se lee LOW,
; así que entraría siempre en calibración. Este entorno no mira ese pin. No usar en la maqueta.
[env:lilygo_t3_banco]
board = ttgo-lora32-v21
build_flags = ${env.build_flags} -DPLACA_LILYGO_T3_V1_6_1 -DSIN_PIN_MODO_CAL -DLORAWAN_DR_JOIN=0

; Montaje simple (2026-11-12): nodo alimentado desde 230 V (inversor solar), sin ADS1115, sin aislador
; y sin medir batería. pH en GPIO36, nivel en GPIO39, presencia de agua en GPIO4, puente de calibración
; en GPIO15 (pull-up interna). Join en SF12 porque desde el aula la cobertura va al límite.
[env:lilygo_t3_simple]
board = ttgo-lora32-v21
build_flags = ${env.build_flags} -DPLACA_LILYGO_T3_V1_6_1 -DSIN_ADS1115 -DLORAWAN_DR_JOIN=0

[env:lilygo_t3s3_sx1262]
board = esp32-s3-devkitc-1
build_flags = ${env.build_flags} -DPLACA_LILYGO_T3S3_SX1262 -DARDUINO_USB_CDC_ON_BOOT=1

; Datos SIMULADOS de todos los sensores (O2, pH, temperatura, nivel, caudal, presencia de agua y batería)
; para probar la web sin sensores. Envía cada 2 min con el mismo payload v2. Código en src/simulacion.cpp.
; Hace el join en SF12 (LORAWAN_DR_JOIN=0) porque desde el aula la cobertura va al límite.
; Para volver a lo real, grabar lilygo_t3_banco o lilygo_t3_v1_6_1. No usar en la maqueta.
[env:lilygo_t3_simulado]
board = ttgo-lora32-v21
build_flags = ${env.build_flags} -DPLACA_LILYGO_T3_V1_6_1 -DSIN_PIN_MODO_CAL -DSIMULAR_SENSORES -DLORAWAN_DR_JOIN=0
